# Server MCP degli agenti civici su Render (piano gratuito), per ChatGPT e i
# connettori di claude.ai. Nessuna dipendenza da installare, nessun dato salvato.
# Si attiva da Render: New > Blueprint > questo repository.
services:
  - type: web
    name: agenti-civici-mcp
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: node --version
    startCommand: node mcp/http.js
    healthCheckPath: /salute
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: LIMITE_MINUTO
        value: "120"
