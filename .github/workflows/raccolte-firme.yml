name: Raccolte firme

# Copia una volta al giorno l'elenco pubblico delle raccolte firme (una sola
# richiesta alla piattaforma del Ministero della Giustizia) e pubblica il sito.
# L'orario automatico è SPENTO: si attiva togliendo il commento a «schedule».
on:
  workflow_dispatch:
  # schedule:
  #   - cron: '17 5 * * *'

permissions:
  contents: write
  actions: write

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/raccolte-firme.mjs
      - run: npm test
      - name: Salva i dati
        run: |
          git config user.name "agenti-civici"
          git config user.email "agenti-civici@users.noreply.github.com"
          git add raccolte-firme/dati
          git diff --cached --quiet || git commit -m "Raccolte firme: dati del $(date -u +%F)"
          git push
      - name: Ripubblica il sito
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pagine.yml --ref main
